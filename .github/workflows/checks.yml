name: Checks

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
    inputs:
      browser_tests:
        description: Run desktop/mobile and production offline browser tests
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Unit tests and build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check

  browser:
    name: Browser and offline regression tests
    if: github.event_name == 'workflow_dispatch' && inputs.browser_tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:static
      - run: npm run test:e2e
      - run: npm run test:offline
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failure-details
          path: |
            test-results/
            test-results-offline/
          retention-days: 7
