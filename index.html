<!doctype html>
<html lang="sr-Cyrl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#244B3A" />
    <meta name="description" content="BelaPčela — породични музеј. Локални прототип породичног стабла." />
    <link rel="icon" type="image/svg+xml" href="/seal.svg" />
    <title>BelaPčela · Породични музеј</title>
    <script>
      try {
        const preference = localStorage.getItem('belapcela-theme');
        document.documentElement.dataset.theme = preference === 'dark' || (!preference && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      } catch { document.documentElement.dataset.theme = 'light'; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
